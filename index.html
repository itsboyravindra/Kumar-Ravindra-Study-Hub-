<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kumar Ravindra Hub - Real OTP</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
#top{background:#0f172a;color:white;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0}
.card{background:white;max-width:700px;margin:14px auto;padding:16px;border-radius:16px;box-shadow:0 2px 8px #0001}
.btn{background:#4f46e5;color:white;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
input{padding:12px;border-radius:10px;border:1px solid #cbd5e1;width:90%;margin:6px 0}
.tabs{display:flex;gap:8px}
.tabs button{padding:6px 12px;border-radius:20px;border:1px solid #cbd5e1;background:white;cursor:pointer}
.tabs button.active{background:#4f46e5;color:white}
.matiks-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.matiks-card{background:#e0e7ff;border:2px solid #6366f1;padding:20px;text-align:center;border-radius:14px;font-size:20px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="top"><b id="welcome">Welcome, Guest!</b><span>🪙 <span id="coins">0</span></span></div>

<div class="card">
<h2>🔐 Real Login - Phone / Email OTP</h2>
<div class="tabs"><button class="active" id="tabPhone" onclick="switchTab('phone')">Phone OTP</button><button id="tabEmail" onclick="switchTab('email')">Email OTP</button></div>

<div id="phoneDiv">
<input id="phone" placeholder="+91 9876543210">
<div id="recaptcha"></div>
<button class="btn" onclick="sendPhoneOTP()">Send Real OTP</button>
</div>

<div id="emailDiv" style="display:none">
<input id="email" placeholder="email@gmail.com">
<button class="btn" onclick="sendEmailOTP()">Send Email Link</button>
<p style="font-size:12px">Email par link jayega, us par click karke login hoga</p>
</div>

<div id="otpDiv" style="display:none">
<input id="otp" placeholder="6 digit OTP">
<button class="btn" onclick="verifyOTP()">Verify OTP - Tabhi Login Hoga</button>
</div>

<p id="loginMsg" style="font-weight:bold"></p>
</div>

<div class="card">
<h2>🔢 Matiks </h2>
<p>Target: <b id="target" style="font-size:26px;color:#4f46e5">0</b> | Score: <b id="mScore">0</b> | Time: <b id="mTime">60</b></p>
<button class="btn" onclick="startMatiks()">Start Matiks</button>
<div class="matiks-board" id="board"></div>
<p id="mMsg"></p>
</div>

<script
const firebaseConfig = {
  apiKey: "AlzaSyDPObZuwkajCO1TE_eSjCXvThZM7VOGFwY",
  authDomain: "kumar-ravindra-study-hub.firebaseapp.com",
  projectId: "kumar-ravindra-study-hub",
  storageBucket: "PASTE HERE",
  messagingSenderId: "PASTE HERE",
  appId: "PASTE HERE"
};

firebase.initializeApp(firebaseConfig);
let recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha', {size:'normal'});
let confirmationResult=null;

let coins=Number(localStorage.getItem('sunilCoins')||0);
document.getElementById('coins').textContent=coins;

function switchTab(t){
  document.getElementById('phoneDiv').style.display=t==='phone'?'block':'none';
  document.getElementById('emailDiv').style.display=t==='email'?'block':'none';
  document.getElementById('tabPhone').classList.toggle('active',t==='phone');
  document.getElementById('tabEmail').classList.toggle('active',t==='email');
}

function sendPhoneOTP(){
  let phone=document.getElementById('phone').value.trim();
  if(!phone.startsWith('+')){document.getElementById('loginMsg').textContent='Number +91 ke saath likho: +9198xxxxxxx';return}
  firebase.auth().signInWithPhoneNumber(phone, recaptchaVerifier).then(res=>{
    confirmationResult=res;
    document.getElementById('otpDiv').style.display='block';
    document.getElementById('loginMsg').textContent='✅ Real OTP bhej diya '+phone+' par! OTP dalo tabhi login hoga.';
  }).catch(e=>{document.getElementById('loginMsg'n verifyOTP(){
  let code=document.getElementById('otp').value.trim();
  if(!confirmationResult){document.getElementById('loginMsg').textContent='Pahle Send OTP dabao';return}
  // YAHI MAIN POINT HAI - BINA SAHI OTP KE LOGIN HOGA HI NAHI
  confirmationResult.confirm(code).then(result=>{
    let user=result.user;
    localStorage.setItem('sunilName', user.phoneNumber);
    document.getElementById('welcome').textContent='Welcome, '+user.phoneNumber+' ✅';
    document.getElementById('loginMsg').textContent='🎉 Real OTP Verified! Login Success. Bina OTP ke login nahi hota.';
    coins+=10; localStorage.setItem('sunilCoins',coins); document.getElementById('coins').textContent=coins;
  }).catch(e=>{
    document.getElementById('loginMsg').textContent='❌ Galat OTP! Login nahi hoga. Error: '+e.message;
  });
}

function sendEmailOTP(){
  let email=document.getElementById('email').value.trim();
  let actionCodeSettings={url: window.location.href, handleCodeInApp:true};
  firebase.auth().sendSignInLinkToEmail(email, actionCodeSettings).then(()=>{
    localStorage.setItem('emailForSignIn',email);
    document.getElementById('loginMsg').textContent='✅ Email par link bhej diya! Email khol ke link par click karo tabhi login hoga.';
  }).catch(e=>{document.getElementById('loginMsg').textContent='Error: '+e.message});
}

// Email link se login check
if(firebase.auth().isSignInWithEmailLink(window.location.href)){
  let email=localStorage.getItem('emailForSignIn')||prompt('Apna email likho');
  firebase.auth().signInWithEmailLink(email, window.location.href).then(result=>{
    localStorage.setItem('sunilName',result.user.email);
    document.getElementById('welcome').textContent='Welcome, '+result.user.email;
    document.getElementById('loginMsg').textContent='Email OTP Verified! Login Success';
  });
}

// Matiks Game
let target=0,mScore=0,mTimeLeft=60,timer=null,selected=[],nums=[];
function startMatiks(){mScore=0;mTimeLeft=60;document.getElementById('mScore').textContent=0;nextRound();clearInterval(timer);timer=setInterval(()=>{mTimeLeft--;document.getElementById('mTime').textContent=mTimeLeft;if(mTimeLeft<=0){clearInterval(timer);document.getElementById('mMsg').textContent='Game Over! Score: '+mScore;coins+=mScore;localStorage.setItem('sunilCoins',coins);document.getElementById('coins').textContent=coins}},1000)}
function nextRound(){target=Math.floor(Math.random()*20+10);document.getElementById('target').textContent=target;let board=document.getElementById('board');board.innerHTML='';selected=[];let a=Math.floor(Math.random()*10+1),b=target-a;nums=[a,b];for(let i=0;i<7;i++) nums.push(Math.floor(Math.random()*20+1));nums.sort(()=>Math.random()-0.5);nums.forEach((n,i)=>{let d=document.createElement('div');d.className='matiks-card';d.textContent=n;d.onclick=()=>{if(selected.includes(i)) return;selected.push(i);d.style.opacity='0.5';let sum=selected.reduce((s,idx)=>s+nums[idx],0);if(sum===target){mScore+=10;document.getElementById('mScore').textContent=mScore;document.getElementById('mMsg').textContent='✅ Sahi! +10';setTimeout(nextRound,400)}else if(sum>target){document.getElementById('mMsg').textContent='❌ Jyada ho gaya';selected=[];document.querySelectorAll('.matiks-card').forEach(c=>c.style.opacity='1')}};board.append(d)});document.getElementById('mMsg').textContent='2 numbers se '+target+' banao - Matiks Style!'}
</script>
</body>
</html>
